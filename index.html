<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calixto Marques Barbearia</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calixto">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:ital,wght@0,700;1,800&display=swap">
<style>
/* Layout: app de celular numa coluna só, no molde da tela da Prestige: topo preto, banner que desliza, cartões que deslizam e barra preta embaixo com botão redondo no meio. */
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --line:#DDD7C9; --fg:#141413; --muted:#5E5A52;
  --gold:#B08D3C; --gold-text:#8A6A22; --on-gold:#0B0B0B; --danger:#B3261E;
  --bar:#000000; --bar-fg:#FFFFFF; --bar-gold:#C9A24B;
  --display:'Montserrat',system-ui,sans-serif; --body:'Jost',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0E; --surface:#171717; --line:#2A2A2A; --fg:#F3EFE6; --muted:#A8A39A;
    --gold-text:#C9A24B; --danger:#F2867F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#171717; --line:#2A2A2A; --fg:#F3EFE6; --muted:#A8A39A;
  --gold-text:#C9A24B; --danger:#F2867F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bleed{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}

.shell{min-height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.top,.tabs{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:4px}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.hand{height:17px;width:auto;flex:0 0 auto}
.hand.flip{transform:scaleX(-1)}
.name{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.name b{font:italic 800 14px/1 var(--display);color:var(--bar-fg);letter-spacing:.02em;white-space:nowrap}
.name span{font:500 9px/1 var(--body);color:var(--bar-gold);letter-spacing:.5em;margin-right:-.5em}
@media (max-width:350px){.hand{display:none}}
.icon-btn{width:44px;height:44px;border:0;background:transparent;color:var(--bar-fg);display:grid;place-items:center;border-radius:50%}
.spacer{width:44px;height:44px}

main{flex:1;padding-block:0 28px;display:flex;flex-direction:column;gap:16px}
main.pad{padding-top:20px}
h1{font:400 26px/1.15 var(--body);margin:0;text-wrap:balance}
h2{font:500 19px/1.2 var(--body);margin:0}
.sec{font:400 23px/1.2 var(--body);margin:0}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.flash{font-size:14px;background:var(--surface);border:1px solid var(--gold);border-radius:10px;padding:10px 12px}
.badge{align-self:flex-start;font:700 11px/1 var(--display);letter-spacing:.1em;background:var(--bar-gold);color:#0B0B0B;padding:5px 9px;border-radius:999px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.wrap{flex-wrap:wrap}

.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 18px;font-weight:500;min-height:44px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.gold[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{padding:6px 14px;min-height:36px;font-size:14px}

.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 4px;font-weight:500;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:600}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;min-height:44px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:0 0 auto}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.opt[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 0;font-weight:500;min-height:44px}
.slot[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.slot[disabled]{text-decoration:line-through;color:var(--muted);background:transparent;cursor:not-allowed}

label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;color:var(--fg);width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{color:var(--danger);font-size:14px;min-height:1.2em}

/* banners que deslizam */
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.ban{position:relative;flex:0 0 100%;scroll-snap-align:start;height:232px;border:0;text-align:left;color:#fff;padding:20px max(20px,env(safe-area-inset-left,0px)) 30px;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden;border-radius:0}
.ban .k{font:700 11px/1 var(--display);letter-spacing:.2em;color:var(--bar-gold)}
.ban .t{font:800 25px/1.1 var(--display);max-width:56%}
.ban .s{font-size:15px;color:#D9D4C8;max-width:56%}
.ban .go{margin-top:8px;align-self:flex-start;background:var(--gold);color:#0B0B0B;font-weight:600;font-size:14px;padding:10px 20px;border-radius:999px}
.ban .art{position:absolute;right:14px;top:50%;transform:translateY(-54%);width:132px;height:132px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:-24px;position:relative;height:3px}
.dots i{display:block;height:3px;width:16px;border-radius:2px;background:#6B6350}
.dots i.on{width:28px;background:var(--bar-gold)}

.swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.swipe::-webkit-scrollbar{display:none}
.tile{flex:0 0 176px;scroll-snap-align:start;text-align:left;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);padding:0;display:flex;flex-direction:column}
.tile .pic{height:96px;display:grid;place-items:center}
.tile .pic svg{width:80px;height:80px}
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.tile .tn{font-weight:500;font-size:18px;line-height:1.2}
.tile .tm{font-size:14px;color:var(--muted)}
.tile .tp{font-weight:600;color:var(--gold-text)}
.svrow{display:flex;gap:14px;align-items:center}
.thumb{flex:0 0 64px;height:64px;border-radius:12px;display:grid;place-items:center}
.thumb svg{width:46px;height:46px}
.svrow .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.svrow .title{font-weight:500;font-size:19px;line-height:1.2}
.svrow .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.price{color:var(--gold-text);font-weight:600}
.artpick{display:flex;gap:8px}
.artbtn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:56px;display:grid;place-items:center;padding:4px}
.artbtn[aria-pressed="true"]{border-color:var(--gold);outline:2px solid var(--gold)}
.artbtn svg{width:36px;height:36px}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted)}
.scroll-x{overflow-x:auto}
.ok{color:var(--gold-text);font-weight:600}
.no{color:var(--muted)}

.appt .when{font:500 19px/1.2 var(--body)}
.appt .what{color:var(--muted);font-size:15px}

.tabs{position:sticky;bottom:0;z-index:5;background:var(--bar);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around;align-items:flex-end}
.tabs button{border:0;background:transparent;color:var(--bar-fg);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;flex:1;min-height:52px;font-size:13px}
.tabs button[aria-current="page"]{color:var(--bar-gold)}
.tabs .round{flex:0 0 76px;height:68px;width:68px;border-radius:50%;border:4px solid var(--bar);background:var(--gold);color:#0B0B0B;margin-top:-30px;justify-content:center;padding:0;font-weight:600;font-size:11px;gap:2px}
.tabs .round[aria-current="page"]{color:#0B0B0B;background:var(--bar-gold)}

.login{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px;text-align:center}
.hero img{height:54px}
.hero .big{font:italic 800 24px/1.1 var(--display);letter-spacing:.02em}
.hero .sub{font:500 11px/1 var(--body);color:var(--gold-text);letter-spacing:.5em;margin-right:-.5em}
.link{background:none;border:0;color:var(--gold-text);text-decoration:underline;padding:10px;min-height:44px;align-self:center}
.link2{background:none;border:0;color:var(--muted);font-size:14px;padding:8px 0;min-height:44px}
.seg2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px}
.num{padding:6px 12px;border-radius:999px;border:1px solid var(--gold);font-weight:600;letter-spacing:.04em}
.num.win{background:var(--gold);color:var(--on-gold)}
.prize{border-radius:16px;background:linear-gradient(135deg,#0B0B0B,#2A210C);border:1px solid var(--gold);padding:22px 20px;display:flex;flex-direction:column;gap:6px;color:#fff}
.prize .k{font:700 11px/1 var(--display);letter-spacing:.2em;color:var(--bar-gold)}
.prize .pz{font:800 34px/1.05 var(--display)}
.prize .nm{color:#D9D4C8;font-size:16px}
.prize .cert{color:var(--bar-gold);font-size:13px}

/* --- ligado ao banco: fotos, carregando, bloqueio durante envio --- */
.cover{width:100%;height:100%;object-fit:cover;display:block}
.thumb{overflow:hidden}
.tile .pic{overflow:hidden}
.ban.photo .t,.ban.photo .s{max-width:80%}
.photo{display:flex;gap:14px;align-items:center}
.photo .thumb{background:var(--bg);border:1px dashed var(--line);flex:0 0 84px;height:84px}
.filebtn{flex-direction:row;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);font-size:14px;cursor:pointer}
body.busy main{opacity:.55;pointer-events:none}
body.busy .tabs{pointer-events:none}
</style>
</head>

  function agendarView(){
    var b = ui.book, tot = bookTotals(), days = [], i;
    for (i=0;i<7;i++) days.push(addDays(today(), i));
    var svcs = data.services.map(function(s){ return '<button class="opt" data-act="bsvc" data-id="'+s.id+'" aria-pressed="'+!!b.sel[s.id]+'"><span style="font-weight:500">'+esc(s.name)+'</span><span style="font-size:14px">'+s.min+' min</span></button>'; }).join("");

    var slots = tot.min > 0 ? slotList(b.date, tot.min) : [];
    var free = slots.filter(function(s){ return !s.busy; }).length;
    var grid = tot.min === 0 ? '<div class="note">Escolha um serviço para ver os horários.</div>'
      : (free === 0 ? '<div class="note">Sem horários livres neste dia. Tente outro dia.</div>'

  function sorteioStaffView(){
    var s = data.sorteio, admin = ui.user.role === "admin";
    if (!s) return '<main class="pad"><h1>Sorteio</h1><p class="muted" style="margin:0">Crie o sorteio para o banner aparecer no app dos clientes. Os números são gerados quando você conclui cada atendimento.</p>'+sorteioForm(null)+'</main>';

    var people = order.map(function(z){ var g = groups[z]; return '<div class="card" style="gap:8px"><div class="row"><b style="font-weight:500">'+esc(g.name)+'</b><span class="muted">'+fmtZap(g.zap)+'</span></div><div class="chips">'+g.ns.map(function(n){ return '<span class="num'+(n===won?' win':'')+'">'+numFmt(n)+'</span>'; }).join("")+'</div></div>'; }).join("");

        ? '<div class="row wrap"><span class="muted">Começar um novo sorteio? Os números atuais deixam de valer.</span><span class="row"><button class="btn small gold" data-act="newsorteio-yes">Começar novo</button><button class="btn small" data-act="del-no">Voltar</button></span></div>'

      : '<button class="btn danger" data-act="delsorteio">Apagar sorteio (admin)</button>';

      '<section class="card"><h2>'+esc(s.name)+'</h2><div style="font:800 24px/1.1 var(--display)">'+esc(s.prize)+'</div>'+(s.drawDate?'<div class="muted">Data do sorteio: '+brDate(s.drawDate)+'</div>':'')+(s.cert?'<div class="muted">Certificado nº '+esc(s.cert)+'</div>':'')+banner+(s.winner?'':'<button class="btn small" data-act="sorteio-edit">Editar dados</button>')+'</section>'+
      win + '<section class="stack"><h2>Clientes e números ('+s.entries.length+')</h2>'+(people||'<div class="note">Ainda ninguém tem número. Eles aparecem aqui quando você concluir atendimentos.</div>')+'</section>' + acts + '</main>';

      return '<div class="card"><div class="svrow"><span class="thumb" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')">'+(b.photo?'<img class="cover" src="'+esc(b.photo)+'" alt="">':art(b.art))+'</span><div class="info"><div class="title">'+esc(b.t)+'</div><div class="meta"><span>'+esc(b.k||"sem etiqueta")+'</span><span>'+(b.on?"ligado":"desligado")+'</span></div></div></div><div class="row wrap">' +
        (conf ? '<span class="muted">Apagar este banner?</span><span class="row"><button class="btn small danger" data-act="bdel-yes" data-id="'+b.id+'">Apagar</button><button class="btn small" data-act="del-no">Voltar</button></span>'
          : '<span class="row"><button class="btn small" data-act="bedit" data-id="'+b.id+'">Editar</button><button class="btn small" data-act="bon" data-id="'+b.id+'">'+(b.on?"Desligar":"Ligar")+'</button><button class="btn small danger" data-act="bdel" data-id="'+b.id+'">Apagar</button></span>') + '</div></div>';
    }).join("");
    return '<section class="stack"><h2>Banners da tela inicial</h2><p class="muted" style="margin:0;font-size:14px">Eles passam sozinhos na tela inicial do cliente. O do sorteio aparece quando o sorteio está ligado.</p>' +
      '<button class="chip" data-act="svcban" aria-pressed="'+!!data.settings.serviceBanners+'">'+(data.settings.serviceBanners?"Banners dos serviços: ligados":"Banners dos serviços: desligados")+'</button>' +
      (rows || '<div class="note">Nenhum banner seu ainda. Os banners dos serviços aparecem sozinhos.</div>') +
      (ui.bannerEdit === "new" ? bannerForm(null) : '<button class="btn gold" data-act="bnew">Novo banner</button>') + '</section>';
  }

  function tabbar(){
    var u = ui.user;
    function b(k, icon, label){ return '<button data-act="tab" data-v="'+k+'"'+(ui.tab===k?' aria-current="page"':'')+'>'+icon+'<span>'+label+'</span></button>'; }
    if (u.role === "cliente"){
      return '<nav class="tabs" aria-label="Seções">'+b("inicio",I.home,"Início")+b("sorteio",I.gift,"Sorteio")+
        '<button class="round" data-act="book" data-id=""'+(ui.tab==="agendar"?' aria-current="page"':'')+' aria-label="Agendar">'+I.cal+'<span>Agendar</span></button>'+
        b("agenda",I.chk,"Agenda")+b("perfil",I.user,"Perfil")+'</nav>';
    }
    return '<nav class="tabs" aria-label="Seções">'+b("agenda",I.chk,"Agenda")+b("servicos",I.cut,"Serviços")+b("sorteio",I.gift,"Sorteio")+(u.role==="admin"?b("ajustes",I.cog,"Ajustes"):"")+'</nav>';
  }

  function render(){
    var focusId = document.activeElement && document.activeElement.id, body;
    if (!ui.user) body = authView();
    else {
      var t = ui.tab, staff = isStaff();
      body = t==="inicio" && !staff ? inicioView() : t==="servicos" ? servicosView() : t==="agendar" && !staff ? agendarView() : t==="sorteio" ? (staff ? sorteioStaffView() : sorteioClienteView()) : t==="perfil" && !staff ? perfilView() : t==="ajustes" && ui.user.role==="admin" ? ajustesView() : agendaView();
    }
    if (ui.flash) body = body.replace(/^(<main[^>]*>)/, '$1<div class="flash" role="status">' + esc(ui.flash) + '</div>');
    document.getElementById("app").innerHTML = header() + body + (ui.user ? tabbar() : "");
    if (focusId){ var el = document.getElementById(focusId); if (el) el.focus(); }
  }
  function parsePrice(t){
    t = String(t).trim().replace(/\./g,"").replace(",",".");
    if (t === "") return null;
    var n = Number(t); return isFinite(n) && n >= 0 ? Math.round(n*100)/100 : NaN;
  }
  function reset(){ ui.editing = null; ui.confirm = null; ui.book = null; ui.sorteioEdit = false; ui.bannerEdit = null; ui.pending = null; ui.forgot = false; ui.newpass = false; }
  function must(rows){ if (!rows || !rows.length) throw new Error("Sem permissão para essa ação."); return rows; }
  async function refreshBusy(){
    var now = Date.now(), rows = await SB.rpc("busy_slots", { p_from:new Date(now).toISOString(), p_to:new Date(now + 9 * 86400000).toISOString() });
    data.busy = rows.map(function(b){ return { s:Date.parse(b.starts_at), e:Date.parse(b.ends_at) }; });
  }
  async function run(fn){
    if (ui.busy) return;
    ui.busy = true; document.body.classList.add("busy");
    try { await fn(); } catch(e){ ui.flash = friendly(e); }
    ui.busy = false; document.body.classList.remove("busy"); render();
  }
  function idle(){
    return ui.user && !ui.busy && !ui.editing && !ui.bannerEdit && !ui.sorteioEdit && !ui.confirm && ui.tab !== "agendar" && ui.tab !== "ajustes";
  }
  function softRefresh(){ if (!idle()) return; refresh().then(function(){ if (idle()) render(); }).catch(function(){}); }

  /* ---------- eventos ---------- */
  document.addEventListener("scroll", function(e){
    var t = e.target;
    if (t && t.id === "car"){
      var i = Math.round(t.scrollLeft / t.clientWidth), ds = document.querySelectorAll("#dots i");
      for (var k=0;k<ds.length;k++) ds[k].className = k === i ? "on" : "";
    }
  }, true);

  document.addEventListener("change", async function(e){
    var t = e.target;
    if (!t || t.id !== "photo-file" || !t.files || !t.files[0]) return;
    var file = t.files[0], msg = document.getElementById("photo-msg"), form = t.closest("form");
    var folder = form && form.id === "svc-form" ? "servicos" : "banners";
    if (msg) msg.textContent = "Enviando a foto…";
    try {
      var blob = await resizeImage(file, 1280);
      ui.draftPhoto = await SB.upload(folder + "/" + uuid() + ".jpg", blob);
      var pv = document.getElementById("photo-prev"); if (pv) pv.innerHTML = photoPrevHtml();
      if (msg) msg.textContent = "Foto pronta. Toque em Salvar para guardar.";
    } catch(ex){ if (msg) msg.textContent = friendly(ex); }
    try { t.value = ""; } catch(_){}
  });

  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if (!b || ui.busy) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), v = b.getAttribute("data-v"), job = null;
    if (act === "art" || act === "banart" || act === "bandest"){
      if (act === "art") ui.draftArt = v; else if (act === "banart") ui.draftBanArt = v; else ui.draftBanDest = v;
      var bs = document.querySelectorAll('[data-act="'+act+'"]');
      for (var k=0;k<bs.length;k++) bs[k].setAttribute("aria-pressed", String(bs[k].getAttribute("data-v") === v));
      return;
    }
    if (act === "photo-clear"){
      ui.draftPhoto = ""; var pv = document.getElementById("photo-prev"); if (pv) pv.innerHTML = photoPrevHtml();
      var pm = document.getElementById("photo-msg"); if (pm) pm.textContent = "";
      return;
    }
    ui.flash = "";
    if (act === "mode"){ ui.authMode = v; }
    else if (act === "forgot"){ ui.forgot = true; }
    else if (act === "cancelforgot"){ ui.forgot = false; }
    else if (act === "resend"){
      var pe = ui.pending;
      job = async function(){ if (pe.kind === "reset") await SB.auth.sendCode(pe.email); else await SB.auth.resend(pe.email); ui.flash = "Código enviado de novo. Olhe também o spam."; };
    }
    else if (act === "cancelsignup"){ ui.pending = null; }
    else if (act === "logout"){ job = async function(){ await SB.auth.signOut(); wipe(); }; }
    else if (act === "tab"){
      ui.tab = v; ui.error = ""; ui.confirm = null; ui.editing = null; ui.sorteioEdit = false; ui.bannerEdit = null;
      if (v === "ajustes") job = async function(){ await refresh(); };
    }
    else if (act === "book"){ startBook(id); }
    else if (act === "bsvc"){ ui.book.sel[id] = !ui.book.sel[id]; ui.book.time = ""; }
    else if (act === "best"){ ui.book.estilo = ui.book.estilo === v ? "" : v; }
    else if (act === "bday"){ ui.book.date = v; ui.book.time = ""; }
    else if (act === "btime"){ ui.book.time = v; ui.error = ""; }
    else if (act === "bconfirm"){
      var tot = bookTotals(), bk = ui.book;
      job = async function(){
        await refreshBusy();
        var ok = tot.min > 0 && bk.time && slotList(bk.date, tot.min).some(function(s){ return s.t === bk.time && !s.busy; });
        if (!ok){ ui.error = "Esse horário acabou de ficar indisponível. Escolha outro."; bk.time = ""; return; }
        var st = msOf(bk.date, bk.time);
        try {
          await SB.insert("appointments", { service_ids:tot.sel.map(function(s){ return s.id; }), style:bk.estilo, starts_at:new Date(st).toISOString(), ends_at:new Date(st + tot.min * 60000).toISOString(), minutes:tot.min });
        } catch(ex){ if (/exclusion/i.test(ex.message)){ await refreshBusy(); bk.time = ""; } throw ex; }
        ui.flash = "Horário marcado para " + dayLong(bk.date) + " às " + bk.time + "."; ui.book = null; ui.tab = "agenda"; ui.error = "";
        await refresh();
      };
    }
    else if (act === "acancel"){ ui.confirm = id; }
    else if (act === "acancel-yes"){ job = async function(){ await SB.rpc("cancel_appointment", { p_id:id }); ui.confirm = null; ui.flash = "Horário cancelado."; await refresh(); }; }
    else if (act === "adone"){
      job = async function(){
        var a = data.appts.filter(function(x){ return x.id === id; })[0], k = await SB.rpc("conclude_appointment", { p_id:id });
        await refresh();
        var got = data.sorteio ? data.sorteio.entries.filter(function(e){ return e.apptId === id; }).map(function(e){ return e.n; }) : [];
        ui.flash = got.length ? "Atendimento concluído. " + (a ? a.client : "O cliente") + " ganhou " + got.length + (got.length === 1 ? " número: " : " números: ") + got.map(numFmt).join(", ") + "." : "Atendimento concluído.";
      };
    }
    else if (act === "new"){ ui.editing = "new"; ui.draftArt = "corte"; ui.draftPhoto = ""; ui.error = ""; ui.confirm = null; }
    else if (act === "edit"){ ui.editing = id; var s0 = svc(id); ui.draftArt = s0 ? artOf(s0) : "corte"; ui.draftPhoto = s0 ? s0.photo : ""; ui.error = ""; ui.confirm = null; }
    else if (act === "cancel"){ ui.editing = null; }
    else if (act === "del"){ ui.confirm = id; }
    else if (act === "del-no"){ ui.confirm = null; }
    else if (act === "del-yes"){ job = async function(){ must(await SB.update("services", { id:"eq." + id }, { active:false })); ui.confirm = null; ui.flash = "Serviço apagado."; await refresh(); }; }
    else if (act === "sorteio-edit"){ ui.sorteioEdit = true; }
    else if (act === "sorteio-cancel"){ ui.sorteioEdit = false; }
    else if (act === "sorteio-toggle"){
      job = async function(){ var s = data.sorteio; must(await SB.update("sorteios", { id:"eq." + s.id }, { banner_on:!s.active })); ui.flash = !s.active ? "Banner do sorteio ligado." : "Banner do sorteio desligado. Nenhum número novo é gerado."; await refresh(); };
    }
    else if (act === "draw"){ ui.confirm = "draw"; }
    else if (act === "draw-yes"){ job = async function(){ await SB.rpc("draw_sorteio", { p_id:data.sorteio.id }); ui.confirm = null; ui.flash = "Sorteio realizado."; await refresh(); }; }
    else if (act === "newsorteio"){ ui.confirm = "newsorteio"; }
    else if (act === "newsorteio-yes"){ job = async function(){ must(await SB.update("sorteios", { id:"eq." + data.sorteio.id }, { status:"encerrado" })); ui.confirm = null; await refresh(); }; }
    else if (act === "delsorteio"){ ui.confirm = "delsorteio"; }
    else if (act === "delsorteio-yes"){ job = async function(){ must(await SB.remove("sorteios", { id:"eq." + data.sorteio.id })); ui.confirm = null; ui.flash = "Sorteio apagado."; await refresh(); }; }
    else if (act === "bnew"){ ui.bannerEdit = "new"; ui.draftBanArt = "corte"; ui.draftBanDest = "agendar"; ui.draftPhoto = ""; ui.confirm = null; }
    else if (act === "bedit"){ var bb = data.banners.filter(function(x){ return x.id === id; })[0]; if (bb){ ui.bannerEdit = id; ui.draftBanArt = bb.art; ui.draftBanDest = bb.dest || "agendar"; ui.draftPhoto = bb.photo; } ui.confirm = null; }
    else if (act === "bcancel"){ ui.bannerEdit = null; }
    else if (act === "bon"){ job = async function(){ var bn = data.banners.filter(function(x){ return x.id === id; })[0]; must(await SB.update("banners", { id:"eq." + id }, { active:!bn.on })); await refresh(); }; }
    else if (act === "bdel"){ ui.confirm = "ban:" + id; }
    else if (act === "bdel-yes"){ job = async function(){ must(await SB.remove("banners", { id:"eq." + id })); ui.confirm = null; ui.flash = "Banner apagado."; await refresh(); }; }
    else if (act === "svcban"){ job = async function(){ must(await SB.update("settings", { id:"eq.1" }, { service_banners:!data.settings.serviceBanners })); await refresh(); }; }
    else if (act === "role-set"){ job = async function(){ await SB.rpc("set_role", { p_user:id, p_role:v }); ui.flash = "Acesso atualizado."; await refresh(); }; }
    if (job) run(job); else render();
    if (act === "tab" || act === "book") window.scrollTo(0, 0);
    if (act === "tab" && ui.user && v !== "ajustes") softRefresh();
  });

  document.addEventListener("submit", async function(e){
    e.preventDefault();
    if (ui.busy) return;
    var f = e.target, err = "";
    function val(id){ var el = document.getElementById(id); return el ? el.value : ""; }
    var btn = f.querySelector('button[type="submit"]'), label = btn ? btn.textContent : "";
    function lock(on){ ui.busy = on; document.body.classList.toggle("busy", on); if (btn){ btn.disabled = on; btn.textContent = on ? "Aguarde…" : label; } }
    var okEmail = function(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); };
    try {
      if (f.id === "login-form"){
        var em = val("f-email").trim().toLowerCase(), pass = val("f-pass");
        if (!okEmail(em)) err = "Digite um e-mail válido.";
        else if (!pass) err = "Digite a senha.";
        else {
          lock(true);
          try { var u = await SB.auth.signIn(em, pass); await enter(u); }
          catch(ex){
            if (/not confirmed/i.test(ex.message || "")){ ui.pending = { kind:"signup", email:em }; try { await SB.auth.resend(em); } catch(_){} }
            else err = friendly(ex);
          }
        }
      } else if (f.id === "signup-form"){
        var nome = val("f-nome").trim(), zs = val("f-zap").replace(/\D/g,""), em2 = val("f-email").trim().toLowerCase(), ps = val("f-pass");
        if (!nome) err = "Digite o seu nome.";
        else if (zs.length < 10) err = "Digite o WhatsApp com DDD.";
        else if (!okEmail(em2)) err = "Digite um e-mail válido.";
        else if (ps.length < 6) err = "A senha precisa ter pelo menos 6 caracteres.";
        else {
          lock(true);
          var r = await SB.auth.signUp(em2, ps, { name:nome, whatsapp:zs });
          if (r.existing) err = "Esse e-mail já tem conta. Toque em Entrar.";
          else if (r.session) await enter(SB.user());
          else ui.pending = { kind:"signup", email:em2 };
        }
      } else if (f.id === "code-form"){
        var code = val("f-code").replace(/\s/g,""), pd = ui.pending;
        if (code.length < 6) err = "Digite o código que chegou no e-mail.";
        else {
          lock(true);
          var uu = await SB.auth.verify(pd.email, code, pd.kind === "reset" ? "email" : "signup");
          if (pd.kind === "reset"){ ui.pending = null; ui.newpass = true; }
          else { ui.pending = null; await enter(uu); }
        }
      } else if (f.id === "forgot-form"){
        var em3 = val("f-email").trim().toLowerCase();
        if (!okEmail(em3)) err = "Digite um e-mail válido.";
        else { lock(true); await SB.auth.sendCode(em3); ui.forgot = false; ui.pending = { kind:"reset", email:em3 }; }
      } else if (f.id === "newpass-form"){
        var np = val("f-pass");
        if (np.length < 6) err = "A senha precisa ter pelo menos 6 caracteres.";
        else { lock(true); await SB.auth.setPassword(np); ui.newpass = false; await enter(SB.user()); ui.flash = "Senha nova salva."; }
      } else if (f.id === "svc-form"){
        if (!isStaff()) return;
        var name = val("e-name").trim(), min = parseInt(val("e-min"),10), price = parsePrice(val("e-price")), nums = parseInt(val("e-nums"),10);
        if (!name) err = "Dê um nome ao serviço.";
        else if (!(min >= 5 && min <= 480)) err = "Informe o tempo em minutos (de 5 a 480).";
        else if (price !== null && isNaN(price)) err = "Valor inválido. Use números, como 35,00.";
        else if (!(nums >= 0 && nums <= 20)) err = "Números do sorteio: de 0 a 20.";
        else {
          lock(true);
          var row = { name:name, minutes:min, price:price == null ? 0 : price, nums:nums, art:ui.draftArt, photo_url:ui.draftPhoto || null }, sid = f.getAttribute("data-id");
          if (sid === "new"){ row.sort = data.allServices.length + 1; await SB.insert("services", row); }
          else must(await SB.update("services", { id:"eq." + sid }, row));
          ui.editing = null; ui.flash = "Serviço salvo."; await refresh();
        }
      } else if (f.id === "sorteio-form"){
        if (!isStaff()) return;
        var sn = val("s-name").trim(), sp2 = val("s-prize").trim();
        if (!sn) err = "Dê um nome ao sorteio.";
        else if (!sp2) err = "Informe o prêmio.";
        else {
          lock(true);
          var srow = { title:sn, prize:sp2, draw_date:val("s-date") || null, certificate:val("s-cert").trim() };
          if (data.sorteio){ must(await SB.update("sorteios", { id:"eq." + data.sorteio.id }, srow)); ui.flash = "Sorteio atualizado."; }
          else { srow.banner_on = true; srow.status = "aberto"; await SB.insert("sorteios", srow); ui.flash = "Sorteio criado. O banner já aparece no app dos clientes."; }
          ui.sorteioEdit = false; await refresh();
        }
      } else if (f.id === "banner-form"){
        if (!ui.user || ui.user.role !== "admin") return;
        var bt = val("b-t").trim();
        if (!bt) err = "Escreva o título do banner.";
        else {
          lock(true);
          var brow = { kicker:val("b-k").trim(), title:bt, body:val("b-s").trim(), cta:val("b-go").trim() || "Ver mais", art:ui.draftBanArt, dest:ui.draftBanDest, photo_url:ui.draftPhoto || null }, bid = f.getAttribute("data-id");
          if (bid === "new"){ brow.active = true; brow.sort = data.banners.length + 1; await SB.insert("banners", brow); }
          else must(await SB.update("banners", { id:"eq." + bid }, brow));
          ui.bannerEdit = null; ui.flash = "Banner salvo."; await refresh();
        }
      } else if (f.id === "team-form"){
        if (!ui.user || ui.user.role !== "admin") return;
        var te = val("t-email").trim().toLowerCase();
        if (!okEmail(te)) err = "Digite um e-mail válido.";
        else {
          var findP = function(){ return data.team.filter(function(p){ return (p.email || "").toLowerCase() === te; })[0]; };
          var person = findP();
          if (!person){ lock(true); await refresh(); lock(false); person = findP(); }
          if (!person) err = "Não achamos esse e-mail. A pessoa precisa criar a conta no app primeiro.";
          else if (person.role !== "client") err = "Essa pessoa já tem acesso da barbearia.";
          else { lock(true); await SB.rpc("set_role", { p_user:person.id, p_role:"barber" }); ui.flash = "Acesso de barbeiro liberado."; await refresh(); }
        }
      } else if (f.id === "hours-form"){
        if (!ui.user || ui.user.role !== "admin") return;
        var o = val("h-open"), c = val("h-close"), nt = parseInt(val("h-notice"),10);
        if (!o || !c || toMin(c) <= toMin(o)) err = "O horário de fechar precisa ser depois do de abrir.";
        else if (!(nt >= 0 && nt <= 72)) err = "Antecedência: de 0 a 72 horas.";
        else { lock(true); must(await SB.update("settings", { id:"eq.1" }, { open_time:o, close_time:c, min_notice_hours:nt })); ui.flash = "Horários salvos."; await refresh(); }
      }
    } catch(ex){ err = friendly(ex); }
    lock(false);
    if (err){ var box = f.querySelector(".err"); if (box) box.textContent = err; else { ui.flash = err; render(); } return; }
    ui.error = ""; render();
    if (ui.user || ui.pending) window.scrollTo(0, 0);
  });

  document.addEventListener("visibilitychange", function(){ if (!document.hidden) softRefresh(); });
  setInterval(function(){ if (!document.hidden) softRefresh(); }, 60000);
  SB.onSignedOut(function(){ wipe(); render(); });

  var lastTouch = 0;
  ["pointerdown","touchstart","wheel"].forEach(function(ev){
    document.addEventListener(ev, function(e){ if (e.target.closest && e.target.closest("#car")) lastTouch = Date.now(); }, { passive:true });
  });
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) setInterval(function(){
    var c = document.getElementById("car");
    if (!c || document.hidden || Date.now() - lastTouch < 8000) return;
    var w = c.clientWidth, n = c.children.length;
    if (n < 2 || !w) return;
    var i = Math.round(c.scrollLeft / w);
    c.scrollTo({ left: ((i + 1) % n) * w, behavior: "smooth" });
  }, 5000);

  render();
  (async function(){
    try { var su = SB.user(); if (su && SB.session()) await enter(su); }
    catch(e){ ui.flash = friendly(e); }
    ui.loading = false; render();
  })();
})();

</script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
</script>
